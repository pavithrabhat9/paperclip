<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI News Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-card: #ffffff;
  --bg-header: #0a0a0a;
  --bg-overlay: rgba(0,0,0,0.6);
  --text-primary: #111111;
  --text-secondary: #555555;
  --text-muted: #888888;
  --text-inverse: #ffffff;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-light: #eff6ff;
  --border: #e5e7eb;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --max-width: 1280px;
  --header-h: 64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg-secondary);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased}

/* Header */
.site-header{position:sticky;top:0;z-index:100;background:var(--bg-header);border-bottom:1px solid rgba(255,255,255,0.06)}
.header-inner{max-width:var(--max-width);margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:var(--header-h);padding:0 24px}
.logo{font-size:20px;font-weight:800;letter-spacing:-0.5px;color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo span{background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-accent{background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:4px;padding:2px 8px;font-size:14px;-webkit-text-fill-color:#fff;color:#fff}

/* Breaking News Bar */
.breaking-bar{background:linear-gradient(135deg,#1e40af,#7c3aed);color:#fff;padding:0;overflow:hidden;position:relative}
.breaking-inner{max-width:var(--max-width);margin:0 auto;display:flex;align-items:stretch;height:44px}
.breaking-label{background:rgba(255,255,255,0.15);display:flex;align-items:center;padding:0 18px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;gap:8px;flex-shrink:0}
.breaking-label .pulse{width:8px;height:8px;border-radius:50%;background:#f87171;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.breaking-scroll{flex:1;overflow:hidden;position:relative}
.breaking-track{display:flex;animation:scrollBanner 30s linear infinite;white-space:nowrap}
.breaking-track:hover{animation-play-state:paused}
.breaking-track a{color:#fff;text-decoration:none;font-size:14px;font-weight:500;padding:0 40px;display:flex;align-items:center;gap:8px;flex-shrink:0;transition:opacity var(--transition)}
.breaking-track a:hover{opacity:0.8}
.breaking-track .sep{color:rgba(255,255,255,0.3);font-size:12px}
@keyframes scrollBanner{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* Tabs */
.tab-bar{background:var(--bg-primary);border-bottom:1px solid var(--border);position:sticky;top:var(--header-h);z-index:99}
.tab-inner{max-width:var(--max-width);margin:0 auto;display:flex;gap:0;padding:0 24px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-inner::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:14px 24px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;border:none;background:none;color:var(--text-muted);cursor:pointer;position:relative;transition:color var(--transition)}
.tab-btn::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%) scaleX(0);width:100%;height:3px;background:var(--accent);border-radius:3px 3px 0 0;transition:transform var(--transition)}
.tab-btn:hover{color:var(--text-primary)}
.tab-btn.active{color:var(--accent)}
.tab-btn.active::after{transform:translateX(-50%) scaleX(0.7)}

/* Main Container */
.main{max-width:var(--max-width);margin:0 auto;padding:28px 24px 60px}

/* Featured Section */
.featured-section{margin-bottom:40px}
.featured-section h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:16px}
.featured-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.featured-main{position:relative;border-radius:var(--radius-lg);overflow:hidden;background:var(--bg-card);box-shadow:var(--shadow-md);cursor:pointer;transition:transform var(--transition),box-shadow var(--transition);min-height:380px}
.featured-main:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.featured-main img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.featured-main .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.2) 60%,rgba(0,0,0,0.05) 100%)}
.featured-main .content{position:absolute;bottom:0;left:0;right:0;padding:32px;color:#fff}
.featured-main .badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;background:var(--accent);margin-bottom:12px}
.featured-main h3{font-size:24px;font-weight:800;line-height:1.25;margin-bottom:8px}
.featured-main p{font-size:15px;opacity:0.85;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.featured-main .meta{font-size:13px;opacity:0.7;display:flex;gap:16px}
.featured-side{display:flex;flex-direction:column;gap:16px}
.featured-side-item{display:flex;gap:16px;background:var(--bg-card);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform var(--transition),box-shadow var(--transition);align-items:flex-start}
.featured-side-item:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.featured-side-item img{width:100px;height:72px;object-fit:cover;border-radius:var(--radius-sm);flex-shrink:0}
.featured-side-item .info{flex:1;min-width:0}
.featured-side-item .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;background:var(--accent-light);color:var(--accent);margin-bottom:6px}
.featured-side-item h4{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.featured-side-item .meta{font-size:12px;color:var(--text-muted)}

/* Article Grid */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-header h2{font-size:20px;font-weight:800;letter-spacing:-0.3px}
.section-header .count{font-size:14px;color:var(--text-muted)}
.article-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.article-card{background:var(--bg-card);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform var(--transition),box-shadow var(--transition);display:flex;flex-direction:column;cursor:pointer}
.article-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.article-card .card-img{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#e5e7eb}
.article-card .card-img img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s ease}
.article-card:hover .card-img img{transform:scale(1.05)}
.article-card .card-img .badge{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;background:rgba(0,0,0,0.7);color:#fff;backdrop-filter:blur(4px)}
.article-card .card-body{padding:18px 20px 20px;flex:1;display:flex;flex-direction:column}
.article-card .card-body .meta-row{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-muted);margin-bottom:8px}
.article-card .card-body .meta-row .dot{width:3px;height:3px;border-radius:50%;background:var(--text-muted)}
.article-card .card-body h3{font-size:17px;font-weight:700;line-height:1.3;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.article-card .card-body p{font-size:14px;color:var(--text-secondary);line-height:1.55;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.article-card .card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--border);margin-top:auto}
.article-card .card-footer .source{font-size:13px;font-weight:600;color:var(--accent)}
.article-card .card-footer .read-btn{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;border:none;background:var(--accent);color:#fff;cursor:pointer;transition:background var(--transition),transform var(--transition)}
.article-card .card-footer .read-btn:hover{background:var(--accent-hover);transform:scale(1.04)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;z-index:1000;background:var(--bg-overlay);backdrop-filter:blur(6px);overflow-y:auto;padding:24px;animation:fadeIn 0.2s ease}
.modal-overlay.active{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-container{max-width:960px;margin:40px auto;background:var(--bg-primary);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;animation:slideUp 0.3s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-close{position:sticky;top:0;z-index:10;display:flex;justify-content:flex-end;padding:16px 20px 0}
.modal-close button{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg-secondary);color:var(--text-secondary);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--transition),color var(--transition)}
.modal-close button:hover{background:var(--accent);color:#fff}
.modal-hero{position:relative;margin:0 24px}
.modal-hero img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--radius-md);display:block}
.modal-hero .badge{position:absolute;top:16px;left:16px;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;background:rgba(0,0,0,0.7);color:#fff;backdrop-filter:blur(4px)}
.modal-body{padding:32px 24px}
.modal-body h1{font-size:30px;font-weight:900;line-height:1.2;letter-spacing:-0.5px;margin-bottom:16px}
.modal-meta{display:flex;flex-wrap:wrap;gap:12px 24px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.modal-meta .meta-item{font-size:14px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.modal-meta .meta-item strong{color:var(--text-primary);font-weight:600}
.modal-meta .meta-item .sep{color:var(--border)}
.modal-content{font-size:16px;line-height:1.8;color:var(--text-secondary);margin-bottom:32px}
.modal-content p{margin-bottom:18px}
.takeaways{background:var(--accent-light);border-radius:var(--radius-md);padding:24px 28px;margin-bottom:32px;border-left:4px solid var(--accent)}
.takeaways h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.8px}
.takeaways ul{list-style:none;padding:0}
.takeaways ul li{padding:8px 0 8px 24px;position:relative;font-size:15px;color:var(--text-primary);line-height:1.5}
.takeaways ul li::before{content:'→';position:absolute;left:0;color:var(--accent);font-weight:700}
.modal-back{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-primary);font-size:14px;font-weight:600;color:var(--text-primary);cursor:pointer;transition:background var(--transition),border-color var(--transition)}
.modal-back:hover{background:var(--bg-secondary);border-color:var(--text-muted)}

/* Related */
.related-section{margin-top:40px;padding-top:28px;border-top:1px solid var(--border)}
.related-section h3{font-size:18px;font-weight:700;margin-bottom:16px}
.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.related-card{background:var(--bg-secondary);border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;transition:transform var(--transition);display:flex;flex-direction:column}
.related-card:hover{transform:translateY(-2px)}
.related-card img{width:100%;aspect-ratio:16/9;object-fit:cover}
.related-card .info{padding:12px 14px 14px}
.related-card .info h4{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.related-card .info .meta{font-size:12px;color:var(--text-muted)}

/* Back to Top */
#backToTop{position:fixed;bottom:30px;right:30px;z-index:500;width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:22px;cursor:pointer;box-shadow:var(--shadow-md);display:none;align-items:center;justify-content:center;transition:background var(--transition),transform var(--transition),opacity var(--transition)}
#backToTop:hover{background:var(--accent-hover);transform:translateY(-2px)}
#backToTop.visible{display:flex}

/* Footer */
.site-footer{background:var(--bg-header);color:rgba(255,255,255,0.6);text-align:center;padding:24px;font-size:13px}
.site-footer strong{color:#fff}

/* Empty state */
.empty-state{text-align:center;padding:80px 20px;color:var(--text-muted)}
.empty-state svg{width:56px;height:56px;margin-bottom:16px;opacity:0.3}
.empty-state h3{font-size:18px;color:var(--text-secondary);margin-bottom:6px}

/* Responsive */
@media(max-width:1024px){
  .featured-grid{grid-template-columns:1fr}
  .featured-main{min-height:300px}
  .featured-side{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .article-grid{grid-template-columns:repeat(2,1fr);gap:20px}
  .related-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .header-inner{padding:0 16px}
  .main{padding:20px 16px 40px}
  .tab-inner{padding:0 12px}
  .tab-btn{padding:12px 16px;font-size:12px}
  .featured-main{min-height:240px}
  .featured-main .content{padding:20px}
  .featured-main h3{font-size:20px}
  .featured-side{grid-template-columns:1fr}
  .featured-side-item img{width:80px;height:60px}
  .breaking-inner{height:38px}
  .breaking-label{font-size:10px;padding:0 12px}
  .breaking-track a{font-size:13px;padding:0 24px}
  .modal-body{padding:24px 16px}
  .modal-body h1{font-size:24px}
  .modal-hero{margin:0 16px}
  .modal-container{margin:20px auto}
}
@media(max-width:640px){
  .article-grid{grid-template-columns:1fr;gap:16px}
  .related-grid{grid-template-columns:1fr}
  .featured-main h3{font-size:18px}
  .featured-main p{font-size:14px}
  .article-card .card-body h3{font-size:16px}
  .modal-overlay{padding:12px}
}
@media(max-width:480px){
  .featured-side-item{flex-direction:column}
  .featured-side-item img{width:100%;height:120px}
}
</style>

(function initSampleData(){
  if(!window.ARTICLES||!window.ARTICLES.articles||window.ARTICLES.articles.length===0){
    window.ARTICLES={articles:sampleArticles};
  }
})();

function formatDate(d){if(!d)return'';try{return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}catch(e){return d}}

function renderFeatured(articles){
  if(!articles||articles.length===0)return'';
  var main=articles[0];
  var side=articles.slice(1,4);
  var html='<section class="featured-section"><h2>Featured Stories</h2><div class="featured-grid">';
  html+='<div class="featured-main" onclick="openModal(\''+main.article_id+'\')"><img src="'+main.image_url+'" alt="" loading="lazy"><div class="overlay"></div><div class="content"><span class="badge">'+main.category+'</span><h3>'+escapeHtml(main.title)+'</h3><p>'+escapeHtml(main.description)+'</p><div class="meta"><span>'+formatDate(main.published_date)+'</span><span>'+main.source_name+'</span><span>'+main.reading_time_minutes+' min read</span></div></div></div>';
  if(side.length>0){
    html+='<div class="featured-side">';
    for(var i=0;i<side.length;i++){
      var a=side[i];
      html+='<div class="featured-side-item" onclick="openModal(\''+a.article_id+'\')"><img src="'+a.image_url+'" alt="" loading="lazy"><div class="info"><span class="badge">'+a.category+'</span><h4>'+escapeHtml(a.title)+'</h4><div class="meta">'+formatDate(a.published_date)+' &middot; '+a.reading_time_minutes+' min</div></div></div>';
    }
    html+='</div>';
  }
  html+='</div></section>';
  return html;
}

function escapeHtml(s){if(typeof s!=='string')return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderGrid(articles){
  if(!articles||articles.length===0)return'<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><h3>No articles found</h3><p>Check back later for new stories.</p></div>';
  var html='<div class="article-grid">';
  for(var i=0;i<articles.length;i++){
    var a=articles[i];
    html+='<div class="article-card" onclick="openModal(\''+a.article_id+'\')"><div class="card-img"><img src="'+a.image_url+'" alt="" loading="lazy"><span class="badge">'+a.category+'</span></div><div class="card-body"><div class="meta-row"><span>'+formatDate(a.published_date)+'</span><span class="dot"></span><span>'+a.reading_time_minutes+' min</span></div><h3>'+escapeHtml(a.title)+'</h3><p>'+escapeHtml(a.description)+'</p><div class="card-footer"><span class="source">'+escapeHtml(a.source_name)+'</span><button class="read-btn" onclick="event.stopPropagation();openModal(\''+a.article_id+'\')">Read More</button></div></div></div>';
  }
  html+='</div>';
  return html;
}

function renderPage(cat){
  var articles=getArticles();
  ALL_ARTICLES=articles;
  if(cat==='all'){currentArticles=articles.slice()}else{currentArticles=articles.filter(function(a){return a.category===cat})}
  var featured=currentArticles.length>0?renderFeatured(currentArticles):'';
  var grid=renderGrid(currentArticles);
  var catName=cat==='all'?'Latest':cat;
  var label=catName.charAt(0).toUpperCase()+catName.slice(1).toLowerCase();
  var count=currentArticles.length;
  document.getElementById('appRoot').innerHTML=featured+'<div class="section-header"><h2>'+label+' Stories</h2><span class="count">'+count+' article'+(count!==1?'s':'')+'</span></div>'+grid;
}

function switchTab(cat){
  currentCategory=cat;
  var btns=document.querySelectorAll('.tab-btn');
  for(var i=0;i<btns.length;i++){btns[i].classList.toggle('active',btns[i].dataset.category===cat)}
  renderPage(cat);
}

document.addEventListener('DOMContentLoaded',function(){
  var tabContainer=document.getElementById('tabContainer');
  tabContainer.addEventListener('click',function(e){
    var btn=e.target.closest('.tab-btn');
    if(btn&&!btn.classList.contains('active')){switchTab(btn.dataset.category)}
  });
  renderPage('all');
  populateBreaking();
  setupBackToTop();
});

function populateBreaking(){
  var articles=getArticles();
  if(articles.length===0){document.getElementById('breakingBar').style.display='none';return}
  var track=document.getElementById('breakingTrack');
  var items=[];
  for(var i=0;i<articles.length;i++){
    items.push('<a href="#" onclick="event.preventDefault();openModal(\''+articles[i].article_id+'\')">'+escapeHtml(articles[i].title)+'</a>');
  }
  var html=items.join('<span class="sep">|</span>');
  track.innerHTML=html+html;
}

function getArticleById(id){
  var articles=getArticles();
  for(var i=0;i<articles.length;i++){if(articles[i].article_id===id)return articles[i]}
  return null;
}

function openModal(id){
  var article=getArticleById(id);
  if(!article)return;
  var overlay=document.getElementById('modalOverlay');
  var container=document.getElementById('modalContainer');
  document.body.style.overflow='hidden';
  var takeawaysHtml='';
  if(article.key_takeaways&&article.key_takeaways.length>0){
    takeawaysHtml='<div class="takeaways"><h3>Key Takeaways</h3><ul>';
    for(var i=0;i<article.key_takeaways.length;i++){takeawaysHtml+='<li>'+escapeHtml(article.key_takeaways[i])+'</li>'}
    takeawaysHtml+='</ul></div>';
  }
  var related=getRelated(article);
  container.innerHTML='<div class="modal-close"><button onclick="closeModal()" aria-label="Close">&times;</button></div><div class="modal-hero"><img src="'+article.image_url+'" alt=""><span class="badge">'+article.category+'</span></div><div class="modal-body"><h1>'+escapeHtml(article.title)+'</h1><div class="modal-meta"><span class="meta-item"><strong>'+escapeHtml(article.source_name)+'</strong><span class="sep">|</span>'+formatDate(article.published_date)+'<span class="sep">|</span>'+article.reading_time_minutes+' min read</span></div><div class="modal-content">'+article.full_content+'</div>'+takeawaysHtml+'<button class="modal-back" onclick="closeModal()">&larr; Back to homepage</button>'+related+'</div>';
  overlay.classList.add('active');
}

function getRelated(current){
  var articles=getArticles();
  var related=articles.filter(function(a){return a.article_id!==current.article_id&&a.category===current.category}).slice(0,3);
  if(related.length<3){
    var others=articles.filter(function(a){return a.article_id!==current.article_id&&a.category!==current.category});
    for(var i=0;i<others.length&&related.length<3;i++){
      if(related.indexOf(others[i])===-1)related.push(others[i]);
    }
  }
  if(related.length===0)return'';
  var html='<div class="related-section"><h3>Related Articles</h3><div class="related-grid">';
  for(var i=0;i<related.length;i++){
    html+='<div class="related-card" onclick="closeModal();openModal(\''+related[i].article_id+'\')"><img src="'+related[i].image_url+'" alt="" loading="lazy"><div class="info"><h4>'+escapeHtml(related[i].title)+'</h4><div class="meta">'+formatDate(related[i].published_date)+' &middot; '+related[i].reading_time_minutes+' min</div></div></div>';
  }
  html+='</div></div>';
  return html;
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow='';
}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
});

document.getElementById('modalOverlay').addEventListener('click',function(e){
  if(e.target===this)closeModal();
});

function setupBackToTop(){
  var btn=document.getElementById('backToTop');
  window.addEventListener('scroll',function(){
    if(window.scrollY>400){btn.classList.add('visible')}else{btn.classList.remove('visible')}
  });
  btn.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
}
</script>
